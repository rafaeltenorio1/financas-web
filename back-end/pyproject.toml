[project]
name = "back-end"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rafael Tenorio", email = "rafaeltenorio568@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pydantic[email]>=2.14.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[project.scripts]
back-end = "back_end:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
