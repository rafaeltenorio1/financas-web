services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - default

  api:
    depends_on:
      mailpit:
        condition: service_started
    volumes:
      - ./back-end:/app
    command: uvicorn main:app --host 0.0.0.0 --reload
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

networks:
  banco:
    internal: false
  proxy:
    name: financas_proxy_dev
    external: false

volumes:
  pgadmin_data:
