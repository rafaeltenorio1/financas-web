x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - banco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logs
    restart: unless-stopped

  api:
    build: ./back-end
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      banco:
      proxy:
        aliases:
          - financas-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logs
    restart: unless-stopped

networks:
  banco:
    internal: true
  proxy:
    name: proxy
    external: true

volumes:
  pgdata:
